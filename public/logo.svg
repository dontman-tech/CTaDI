<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CTaDI">
  <defs>
    <linearGradient id="ctadi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5A642"/>
      <stop offset="52%" stop-color="#F16B32"/>
      <stop offset="100%" stop-color="#D94D27"/>
    </linearGradient>
  </defs>

  <!-- Charcoal disc: the dark canvas -->
  <circle cx="32" cy="32" r="30" fill="#0B0D10"/>

  <!-- Open ring: the gradient arc -->
